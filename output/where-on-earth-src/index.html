<!doctype html>
<html><head><meta charset="utf-8"><title>Where On Earth</title>
<style>
  html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000;font-family:Inter,sans-serif}
  #c{position:absolute;inset:0;width:1280px;height:720px}
  .hud{position:absolute;color:#fff;font-weight:900;letter-spacing:.02em;text-shadow:0 3px 0 rgba(0,0,0,.35)}
  #roundTag{left:28px;top:24px;background:rgba(10,14,30,.72);padding:10px 18px;border-radius:12px;font-size:22px;border:2px solid rgba(255,214,10,.8)}
  #score{right:28px;top:24px;background:rgba(10,14,30,.72);padding:10px 18px;border-radius:12px;font-size:22px;text-align:right}
  #score b{color:#FFD60A}
  #timerWrap{left:50%;bottom:30px;transform:translateX(-50%);width:520px;height:58px;background:rgba(10,14,30,.72);border-radius:16px;overflow:hidden}
  #timerBar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#FFD60A,#ff8a00)}
  #timerNum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff}
  #card{left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
  #cardMain{font-size:118px;line-height:1;color:#fff;-webkit-text-stroke:3px #111;text-shadow:0 8px 0 #111,0 14px 30px rgba(0,0,0,.5)}
  #cardMain .y{color:#FFD60A}
  #cardSub{margin-top:22px;font-size:32px;font-weight:800;background:#111;color:#fff;padding:10px 22px;border-radius:12px;text-shadow:none}
  #callouts{position:absolute;inset:0}
  .co{position:absolute;font-size:24px;font-weight:900;color:#111;background:#FFD60A;padding:8px 14px;border-radius:10px;white-space:nowrap;box-shadow:0 6px 0 #111;border:3px solid #111}
  .co .n{display:inline-block;background:#111;color:#FFD60A;border-radius:6px;padding:0 8px;margin-right:8px}
  .dot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#FFD60A;border:3px solid #111}
  svg{position:absolute;inset:0}
  #reveal{left:0;right:0;bottom:70px;text-align:center}
  #revName{font-size:96px;color:#FFD60A;-webkit-text-stroke:3px #111;text-shadow:0 7px 0 #111}
  #revInfo{display:inline-block;margin-top:10px;font-size:30px;background:#111;padding:8px 20px;border-radius:12px;text-shadow:none}
  #revInfo b{color:#7CFF6B}
  #flash{position:absolute;inset:0;background:#fff;pointer-events:none}
  #vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
</style></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="vignette"></div>
<svg id="lines" width="1280" height="720"></svg>
<div id="callouts"></div>
<div id="roundTag" class="hud"></div>
<div id="score" class="hud"></div>
<div id="timerWrap" class="hud"><div id="timerBar"></div><div id="timerNum"></div></div>
<div id="reveal" class="hud"><div id="revName"></div><div id="revInfo"></div></div>
<div id="card" class="hud"><div id="cardMain"></div><div id="cardSub"></div></div>
<div id="flash"></div>
<script src="node_modules/topojson-client/dist/topojson-client.min.js"></script>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ---------- utils ----------
let _s = 1;
const seed = n => { _s = n >>> 0; };
const rnd = () => { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a, b) => a + (b - a) * rnd();
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
// fade in at a, out at b
const win = (t, a, b, f = .25) => Math.min(lin(t, a, a + f), 1 - lin(t, b - f, b));

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1280, 720, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

const M = {};
const mat = (c, o = {}) => { const k = c + JSON.stringify(o); return M[k] || (M[k] = new THREE.MeshStandardMaterial({ color: c, roughness: .9, flatShading: true, ...o })); };
function mesh(geo, c, o) { const m = new THREE.Mesh(geo, typeof c === 'string' || typeof c === 'number' ? mat(c, o) : c); m.castShadow = true; m.receiveShadow = true; return m; }
const box = (w, h, d, c, o) => mesh(new THREE.BoxGeometry(w, h, d), c, o);
const at = (m, x, y, z) => { m.position.set(x, y, z); return m; };

function gradTex(top, bot) {
  const cv = document.createElement('canvas'); cv.width = 4; cv.height = 256;
  const g = cv.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top); gr.addColorStop(.62, bot); gr.addColorStop(1, bot);
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function textTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}

// ---------- common street pieces ----------
function ground(g, c, w = 800, x = 0) { const m = mesh(new THREE.PlaneGeometry(w, 800), c); m.rotation.x = -Math.PI / 2; m.position.set(x, 0, -300); m.castShadow = false; g.add(m); return m; }
function road(g, w, c, x = 0) { const m = box(w, .04, 520, c); m.position.set(x, .02, -240); m.castShadow = false; g.add(m); }
function solid(g, x, c, w = .14) { const m = box(w, .02, 520, c, { roughness: .6 }); m.position.set(x, .05, -240); m.castShadow = false; g.add(m); }
function dashed(g, x, c, dash = 3, gap = 6, w = .14) {
  for (let z = 20; z > -300; z -= dash + gap) { const m = box(w, .02, dash, c, { roughness: .6 }); m.position.set(x, .05, z); m.castShadow = false; g.add(m); }
}
function tree(g, x, z, s = 1, c = '#3f7a35') {
  const t = mesh(new THREE.CylinderGeometry(.15 * s, .22 * s, 2.2 * s, 6), '#6b4a2e'); at(t, x, 1.1 * s, z); g.add(t);
  const c1 = mesh(new THREE.IcosahedronGeometry(1.5 * s, 0), c); at(c1, x, 2.9 * s, z); c1.rotation.set(rnd() * 3, rnd() * 3, 0); g.add(c1);
}
function pine(g, x, z, s = 1) {
  const t = mesh(new THREE.CylinderGeometry(.12 * s, .18 * s, 1.4 * s, 5), '#5a3e28'); at(t, x, .7 * s, z); g.add(t);
  for (let i = 0; i < 3; i++) { const c = mesh(new THREE.ConeGeometry((1.6 - i * .4) * s, 2 * s, 7), '#2f5a34'); at(c, x, (1.8 + i * 1.1) * s, z); g.add(c); }
}
function house(g, x, z, w, h, d, wall, roof, rotY = 0) {
  const grp = new THREE.Group();
  grp.add(at(box(w, h, d, wall), 0, h / 2, 0));
  const r = mesh(new THREE.ConeGeometry(Math.max(w, d) * .78, h * .6, 4), roof); r.rotation.y = Math.PI / 4; r.scale.set(w / Math.max(w, d), 1, d / Math.max(w, d)); at(r, 0, h + h * .3, 0); grp.add(r);
  // windows
  for (let i = -1; i <= 1; i += 2) { const win_ = box(.9, .9, .05, '#233040', { roughness: .2, metalness: .3 }); at(win_, i * w * .25, h * .6, d / 2 + .03); grp.add(win_); }
  grp.position.set(x, 0, z); grp.rotation.y = rotY; g.add(grp); return grp;
}
function car(g, x, z, body = '#e9e9e9', rotY = 0) {
  const grp = new THREE.Group();
  grp.add(at(box(1.7, .7, 3.8, body, { roughness: .35, metalness: .4 }), 0, .65, 0));
  grp.add(at(box(1.5, .6, 2, '#1e2a36', { roughness: .15, metalness: .6 }), 0, 1.25, -.2));
  for (const [wx, wz] of [[-.85, 1.2], [.85, 1.2], [-.85, -1.2], [.85, -1.2]]) { const w = mesh(new THREE.CylinderGeometry(.36, .36, .25, 10), '#151515'); w.rotation.z = Math.PI / 2; at(w, wx, .36, wz); grp.add(w); }
  grp.add(at(box(.35, .18, .05, '#ff3030', { emissive: '#aa0000' }), -.6, .75, 1.92)); grp.add(at(box(.35, .18, .05, '#ff3030', { emissive: '#aa0000' }), .6, .75, 1.92));
  grp.position.set(x, 0, z); grp.rotation.y = rotY; g.add(grp); return grp;
}
function mountain(g, x, z, r, h, c = '#6c7a72', snow = true) {
  const m = mesh(new THREE.ConeGeometry(r, h, 7), c); at(m, x, h / 2 - 1, z); m.rotation.y = rnd() * 3; m.castShadow = false; g.add(m);
  if (snow) { const s = mesh(new THREE.ConeGeometry(r * .34, h * .34, 7), '#f4f7fa'); at(s, x, h - 1 - h * .17 + .05, z); s.rotation.y = m.rotation.y; s.castShadow = false; g.add(s); }
}

// ---------- the five worlds ----------
const ROUNDS = [];

ROUNDS.push({
  name: 'JAPAN', iso: '392', lat: 36.2, lon: 138.25, lane: -1.5, km: '3 km away', pts: 5000,
  sky: ['#6fb3ff', '#e7f3ff'], fog: '#dcebf7', sun: [-30, 40, 20], sunI: 2.6,
  build(g) {
    seed(11);
    ground(g, '#7c8c5c'); road(g, 6.4, '#3b3d40');
    solid(g, -3, '#f2f2f2'); solid(g, 3, '#f2f2f2'); solid(g, 0, '#f3c316', .16);
    // sidewalk curbs
    for (const s of [-1, 1]) { const c = box(1.2, .15, 520, '#a9a9a2'); at(c, s * 3.8, .08, -240); c.castShadow = false; g.add(c); }
    // houses
    for (let z = 10; z > -170; z -= R(6.5, 9)) for (const s of [-1, 1]) {
      const cols = ['#e8e2d4', '#d9d4c7', '#c9cfd2', '#efe9df', '#b9b2a6'];
      house(g, s * R(8, 10), z, R(5, 7), R(3.2, 5.5), R(5, 6.5), cols[Math.floor(rnd() * 5)], s < 0 ? '#3a4652' : '#4a4a52');
    }
    // concrete utility poles + wires
    const tops = [];
    for (let z = 12; z > -200; z -= 9) {
      const p = mesh(new THREE.CylinderGeometry(.13, .19, 8.5, 8), '#a3a39c'); at(p, -4.2, 4.25, z); g.add(p);
      const cb = box(1.8, .12, .12, '#8f8f88'); at(cb, -4.2, 7.6, z); g.add(cb);
      const tr = mesh(new THREE.CylinderGeometry(.28, .28, .7, 8), '#7f8a8f'); at(tr, -3.9, 6.7, z); if ((z | 0) % 2 === 0) g.add(tr);
      tops.push(z);
    }
    const wm = new THREE.LineBasicMaterial({ color: '#1b1b1b' });
    for (const [dx, dy] of [[-.8, 7.65], [0, 7.65], [.8, 7.65], [.3, 6.9], [-.4, 6.3]]) {
      for (let i = 0; i < tops.length - 1; i++) {
        const pts = []; for (let k = 0; k <= 8; k++) { const f = k / 8; pts.push(new THREE.Vector3(-4.2 + dx, dy - Math.sin(f * Math.PI) * .45, tops[i] + (tops[i + 1] - tops[i]) * f)); }
        g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), wm));
      }
    }
    // vending machines
    for (const z of [-11, -48]) {
      const vm = new THREE.Group();
      vm.add(at(box(.8, 1.85, 1.1, '#f5f7fa', { roughness: .4 }), 0, .93, 0));
      vm.add(at(box(.04, 1.1, .9, '#bfe3ff', { emissive: '#7fc4ff', emissiveIntensity: .9 }), .42, 1.15, 0));
      for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) vm.add(at(box(.05, .18, .12, ['#e33', '#3a7', '#fc3', '#36c'][c], { emissive: ['#a11', '#174', '#a80', '#139'][c] }), .45, .8 + r * .3, -.33 + c * .22));
      vm.position.set(-4.4, 0, z); g.add(vm);
    }
    // parked kei-car on the LEFT
    car(g, -1.6, -26, '#f4f4f4', Math.PI); car(g, 1.6, -70, '#2d5aa6', 0);
    // blue direction sign
    const sp = mesh(new THREE.CylinderGeometry(.08, .08, 5.5, 6), '#9aa'); at(sp, 4.2, 2.75, -38); g.add(sp);
    const st = textTex(512, 256, (c, w, h) => { c.fillStyle = '#1756b8'; c.fillRect(0, 0, w, h); c.strokeStyle = '#fff'; c.lineWidth = 10; c.strokeRect(10, 10, w - 20, h - 20); c.fillStyle = '#fff'; c.beginPath(); c.moveTo(256, 40); c.lineTo(300, 110); c.lineTo(270, 110); c.lineTo(270, 220); c.lineTo(242, 220); c.lineTo(242, 110); c.lineTo(212, 110); c.fill(); c.fillRect(270, 150, 170, 26); c.font = '900 54px IPAGothic'; c.fillText('20', 70, 160); });
    const sg = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, .08), [mat('#1756b8'), mat('#1756b8'), mat('#1756b8'), mat('#1756b8'), new THREE.MeshStandardMaterial({ map: st }), mat('#1756b8')]);
    at(sg, 3.4, 5.2, -38); g.add(sg);
    // green hills
    for (let i = 0; i < 14; i++) { const h = mesh(new THREE.IcosahedronGeometry(R(25, 45), 1), '#4e7a45'); h.scale.y = R(.5, .8); at(h, (i % 2 ? 1 : -1) * R(40, 110), -6, -R(140, 260)); h.castShadow = false; g.add(h); }
  },
  clues: [
    { t: 4, text: 'Cars drive on the LEFT', a: [-1.6, 1.3, -26] },
    { t: 6.5, text: 'Concrete poles + tangled wires', a: [-4.2, 7.6, -30] },
    { t: 9, text: 'Vending machine on the street', a: [-4.4, 1.4, -11] },
  ]
});

ROUNDS.push({
  name: 'KENYA', iso: '404', lat: 0.4, lon: 37.9, lane: -1.7, km: '140 km away', pts: 4780,
  sky: ['#4a9bf0', '#f6e7c8'], fog: '#efdcb8', sun: [3, 60, 4], sunI: 3.2,
  build(g) {
    seed(22);
    ground(g, '#b4562d');
    road(g, 7, '#9c4a2a');
    for (const x of [-1.8, 1.8]) { const t = box(.9, .045, 520, '#86391f'); at(t, x, .03, -240); t.castShadow = false; g.add(t); }
    // grass tufts
    const tuftGeo = new THREE.ConeGeometry(.35, .7, 4);
    for (let i = 0; i < 260; i++) { const x = (rnd() < .5 ? -1 : 1) * R(4.2, 60); const m = mesh(tuftGeo, rnd() < .5 ? '#c9a94a' : '#a8953e'); at(m, x, .3, R(15, -200)); m.castShadow = false; g.add(m); }
    // acacias
    const acacia = (x, z, s) => {
      const t = mesh(new THREE.CylinderGeometry(.12 * s, .22 * s, 4 * s, 6), '#4a3323'); at(t, x, 2 * s, z); t.rotation.z = R(-.15, .15); g.add(t);
      for (let k = 0; k < 2; k++) { const b = mesh(new THREE.CylinderGeometry(.06 * s, .1 * s, 1.8 * s, 5), '#4a3323'); at(b, x + (k ? .5 : -.5) * s, 3.9 * s, z); b.rotation.z = k ? -.7 : .7; g.add(b); }
      const c = mesh(new THREE.IcosahedronGeometry(3.2 * s, 1), '#4f6a2a'); c.scale.set(1.15, .22, 1); at(c, x, 4.6 * s, z); g.add(c);
    };
    acacia(-10, -20, 1.1); acacia(12, -17, 1);
    for (let i = 0; i < 34; i++) acacia((rnd() < .5 ? -1 : 1) * R(9, 80), R(5, -220), R(.8, 1.3));
    // distant hills
    for (let i = 0; i < 9; i++) { const h = mesh(new THREE.ConeGeometry(R(40, 80), R(10, 22), 6), '#8a8f9c'); at(h, R(-200, 200), 0, -R(220, 300)); h.castShadow = false; g.add(h); }
    car(g, -1.8, -34, '#f2f2f2', Math.PI);
    // termite mound
    const tm = mesh(new THREE.ConeGeometry(.7, 2.4, 6), '#a2482a'); at(tm, 6, 1.2, -9); g.add(tm);
  },
  clues: [
    { t: 4, text: 'Deep red laterite soil', a: [5, .1, -11] },
    { t: 6.5, text: 'Flat-topped acacia trees', a: [-10, 5, -20] },
    { t: 9, text: 'Tiny shadows = sun overhead = Equator', a: [12, .2, -17] },
  ]
});

ROUNDS.push({
  name: 'NORWAY', iso: '578', lat: 61.2, lon: 7.0, lane: 1.6, km: '9 km away', pts: 4991,
  sky: ['#8aa4bb', '#dfe6ea'], fog: '#cfd8de', sun: [40, 25, -30], sunI: 1.8,
  build(g) {
    seed(33);
    ground(g, '#4f6b3a', 400, 194); // land right of x=-6
    const wtr = mesh(new THREE.PlaneGeometry(500, 800), '#2b5670', { roughness: .15, metalness: .35, flatShading: false }); wtr.rotation.x = -Math.PI / 2; at(wtr, -256, -.25, -300); wtr.castShadow = false; g.add(wtr);
    const bank = box(3, .6, 520, '#5e5a52'); at(bank, -6.5, -.1, -240); bank.castShadow = false; g.add(bank);
    road(g, 6.6, '#38393b'); solid(g, -3.1, '#eee'); solid(g, 3.1, '#eee'); dashed(g, 0, '#f2c200', 3, 9, .15);
    for (let z = 10; z > -200; z -= 12) for (const s of [-1, 1]) {
      const p = mesh(new THREE.CylinderGeometry(.07, .07, 1, 6), '#141414'); at(p, s * 3.7, .5, z); g.add(p);
      const r = box(.09, .22, .1, '#ffc400', { emissive: '#7a5a00' }); at(r, s * 3.7, .82, z + .05); g.add(r);
    }
    for (let i = 0; i < 22; i++) mountain(g, -R(50, 160), -R(20, 280), R(28, 55), R(45, 95), '#5d6b62');
    for (let i = 0; i < 10; i++) mountain(g, R(60, 160), -R(60, 280), R(30, 50), R(50, 90), '#55664f');
    const rh = (x, z, rot) => { const h = house(g, x, z, 6, 3.6, 5, '#a3242a', '#2b2b2b', rot); for (const sx of [-3, 3]) h.add(at(box(.25, 3.6, .25, '#f2f2f2'), sx, 1.8, 2.5)); };
    rh(10, -22, -.2); rh(15, -38, .1); rh(9, -64, -.15); rh(-12.5, -90, .3);
    for (let i = 0; i < 70; i++) pine(g, R(7, 40), R(10, -200), R(.9, 1.6));
  },
  clues: [
    { t: 4, text: 'Yellow centre line (Sweden = white!)', a: [0, .05, -14] },
    { t: 6.5, text: 'Black posts, yellow reflectors', a: [3.7, .9, -26] },
    { t: 9, text: 'Red wooden houses on a fjord', a: [10, 4, -22] },
  ]
});

ROUNDS.push({
  name: 'USA', sub: 'ARIZONA', iso: '840', lat: 33.6, lon: -111.6, lane: 1.9, km: '4 km away', pts: 4996,
  sky: ['#2f86ea', '#f3dcb4'], fog: '#ecd4ad', sun: [-35, 35, 10], sunI: 3,
  build(g) {
    seed(44);
    ground(g, '#c8a16b'); road(g, 8.2, '#46413c');
    solid(g, -.17, '#f5c400', .13); solid(g, .17, '#f5c400', .13); solid(g, -3.8, '#f2f2f2'); solid(g, 3.8, '#f2f2f2');
    const sag = (x, z, s) => {
      const c = '#4c7a3e';
      g.add(at(mesh(new THREE.CylinderGeometry(.42 * s, .48 * s, 7 * s, 9), c), x, 3.5 * s, z));
      g.add(at(mesh(new THREE.SphereGeometry(.42 * s, 9, 6), c), x, 7 * s, z));
      for (const [d, h, l] of [[1, 3.2, 2.2], [-1, 4.2, 1.8]]) {
        const hz = mesh(new THREE.CylinderGeometry(.27 * s, .27 * s, 1.1 * s, 8), c); hz.rotation.z = Math.PI / 2; at(hz, x + d * .7 * s, h * s, z); g.add(hz);

        g.add(at(mesh(new THREE.SphereGeometry(.27 * s, 8, 5), c), x + d * 1.2 * s, (h + l) * s, z));
      }
    };
    sag(7.5, -14, 1);

{ const sg = new THREE.BufferGeometry(); const p = []; for (let i = 0; i < 2500; i++) { const v = new THREE.Vector3(R(-1, 1), R(-1, 1), R(-1, 1)).normalize().multiplyScalar(R(150, 400)); p.push(v.x, v.y, v.z); } sg.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); globeScene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: '#cfd8ff', size: 1.1, sizeAttenuation: false }))); }

function drawGlobeTex(hl) {
  const W = 4096, H = 2048; const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
  const og = c.createLinearGradient(0, 0, 0, H); og.addColorStop(0, '#0c3a6b'); og.addColorStop(.5, '#1662a8'); og.addColorStop(1, '#0c3a6b');
  c.fillStyle = og; c.fillRect(0, 0, W, H);
  const P = (lon, lat) => [(lon + 180) / 360 * W, (90 - lat) / 180 * H];
  const ringPath = (ring, off) => { let prev = null, lon0; ring.forEach(([lo, la], i) => { if (prev !== null) { while (lo - prev > 180) lo -= 360; while (lo - prev < -180) lo += 360; } prev = lo; const [x, y] = P(lo, la); i ? c.lineTo(x + off, y) : c.moveTo(x + off, y); }); c.closePath(); };

  }

}

function makePin() {

// ---------- street rendering ----------
let curR = -1;
function showStreet(i, s, opts = {}) {

      $('timerNum').textContent = `0:${String(Math.ceil(tl)).padStart(2, '0')}`;

      $('revInfo').innerHTML = `Guess: ${r.km} &nbsp;·&nbsp; <b>+${fmt(r.pts)}</b>`; $('revInfo').style.opacity = lin(g, 3.2, 3.5);
